
{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Edit Profile</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="first_name" class="form-label">First Name</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                class="form-control"
                value="{{ profile_user.first_name }}"
            >
        </div>

        <div class="mb-3">
            <label for="last_name" class="form-label">Last Name</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                class="form-control"
                value="{{ profile_user.last_name }}"
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                value="{{ profile_user.email }}"
                required
            >
        </div>

        <button type="submit" class="btn btn-success">
            Save Changes
        </button>

        <a href="{% url 'profile' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
